name: Check

# Started by hand: validates every data file against its schema.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to check (branch, tag, or SHA)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check
        run: python tools/check.py
